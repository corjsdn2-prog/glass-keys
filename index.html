#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;font-size:13px;letter-spacing:.08em;font-weight:500;pointer-events:none;text-shadow:1px 0 rgba(255,59,59,.7),-1px 0 rgba(61,242,255,.7);white-space:pre}

#hint{position:fixed;left:50%;top:47%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.18em;color:#F4F4F2;opacity:.85;text-align:center;pointer-events:none;transition:opacity .6s;animation:blink 1.2s steps(2) infinite;text-shadow:1px 0 #FF3B3B,-1px 0 #3DF2FF}

@keyframes blink{50%{opacity:.35}}
#mobileForm{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);display:none;gap:6px}
